name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (CUDA 12.8, build + CPU tests)
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build git ca-certificates xorg-dev libgl1-mesa-dev

      - uses: actions/checkout@v4

      # GitHub runners have no GPU, so build for a fixed architecture and skip GPU tests.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=86

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --label-exclude gpu
